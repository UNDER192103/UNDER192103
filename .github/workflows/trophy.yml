name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy image
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=UNDER192103&theme=dracula&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false"
          path: profile-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-trophy.svg
          git commit -m "Update GitHub trophies" || exit 0
          git push
