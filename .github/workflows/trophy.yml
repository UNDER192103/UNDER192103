name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy image
        uses: soulteary/github-profile-trophy-action@main
        with:
          username: UNDER192103
          theme: dracula
          output: profile-trophy.svg

      - name: Commit generated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-trophy.svg
          git diff --cached --quiet || git commit -m "Update GitHub trophies"
          git push
